<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Actions</title>
    <style>
      /* Theme variables — fallback values match Logseq DB's modern default
         palette as closely as possible. The `var(--ls-*, …)` references
         are no-ops in a cross-origin iframe today (Logseq doesn't propagate
         these into plugin docs), but kept so any future SDK change flows
         through automatically. Custom Logseq themes will still see our
         fallbacks; that's a known v1 limitation. */
      :root {
        --bg: var(--ls-primary-background-color, #ffffff);
        --soft: var(--ls-secondary-background-color, #f7f8fa);
        --fg: var(--ls-primary-text-color, #1f2937);
        --muted: var(--ls-secondary-text-color, #6b7280);
        --border: var(--ls-border-color, #e5e7eb);
        --hover: var(--ls-tertiary-background-color, #f3f4f6);
        --accent: var(--ls-link-text-color, #2563eb);
        --accent-hover: var(--ls-link-text-hover-color, #1d4ed8);
        --danger: #dc2626;
        --warning: #d97706;
        --success: #059669;

        /* LOCAL/REMOTE endpoint badge colors (see REQUIREMENTS §8) */
        --endpoint-local-bg: #dcfce7;
        --endpoint-local-fg: #166534;
        --endpoint-remote-bg: #fef3c7;
        --endpoint-remote-fg: #92400e;
      }

      /* Dark mode driven by `html.dark` set from Logseq's theme via
         logseq.App.onThemeModeChanged in src/index.ts.
         See logseq-plugin-dev runtime-gotchas.md §2. */
      html.dark {
        --bg: var(--ls-primary-background-color, #1f2024);
        --soft: var(--ls-secondary-background-color, #24262c);
        --fg: var(--ls-primary-text-color, #e5e7eb);
        --muted: var(--ls-secondary-text-color, #9ca3af);
        --border: var(--ls-border-color, #2c2e36);
        --hover: var(--ls-tertiary-background-color, #2a2c32);
        --accent: var(--ls-link-text-color, #60a5fa);
        --accent-hover: var(--ls-link-text-hover-color, #3b82f6);
        --danger: #f87171;
        --warning: #fbbf24;
        --success: #34d399;

        --endpoint-local-bg: #14532d;
        --endpoint-local-fg: #bbf7d0;
        --endpoint-remote-bg: #78350f;
        --endpoint-remote-fg: #fde68a;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        color: var(--fg);
      }

      /* The iframe is hidden until logseq.showMainUI() is called, so
         a backdrop here only shows when the diff panel is live. */
      body {
        background: rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        overflow-y: auto;
        min-height: 100vh;
      }

      /* Diff panel — rendered into #app by src/ui/show-diff.ts */
      .diff-root {
        width: min(1100px, 95vw);
        margin: 48px 16px;
      }
      .diff-modal {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .diff-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
      }
      .diff-header-main {
        display: inline-flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }
      .endpoint-badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 0.72em;
        letter-spacing: 0.06em;
        white-space: nowrap;
        vertical-align: baseline;
      }
      .endpoint-badge strong {
        font-weight: 700;
      }
      .endpoint-badge-local {
        background: var(--endpoint-local-bg);
        color: var(--endpoint-local-fg);
      }
      .endpoint-badge-remote {
        background: var(--endpoint-remote-bg);
        color: var(--endpoint-remote-fg);
      }
      .diff-hint {
        color: var(--muted);
        font-size: 0.85em;
      }
      .diff-hint kbd {
        background: var(--hover);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 6px;
        font-family: inherit;
        font-size: 0.9em;
      }
      .diff-body {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        background: var(--border);
        min-height: 240px;
      }
      .diff-column {
        background: var(--bg);
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      .diff-column h4 {
        margin: 0;
        font-size: 0.85em;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .diff-pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 0.95em;
        line-height: 1.55;
      }
      .diff-edit {
        width: 100%;
        min-height: 220px;
        resize: vertical;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 0.95em;
        line-height: 1.55;
        padding: 8px;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .diff-added {
        background: color-mix(in oklab, var(--success) 18%, transparent);
        border-radius: 3px;
        padding: 0 2px;
      }
      .diff-removed {
        background: color-mix(in oklab, var(--danger) 16%, transparent);
        border-radius: 3px;
        padding: 0 2px;
        text-decoration: line-through;
      }
      .diff-action-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
        flex-wrap: wrap;
      }
      .diff-action-btn {
        padding: 5px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--bg);
        color: var(--fg);
        font: inherit;
        font-size: 0.9em;
        cursor: pointer;
      }
      .diff-action-btn:hover:not(:disabled) {
        background: var(--hover);
      }
      .diff-action-btn:disabled {
        cursor: default;
        opacity: 0.55;
      }
      .diff-action-btn-current {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
        opacity: 1;
      }
      .diff-action-status {
        color: var(--muted);
        font-size: 0.85em;
        margin-left: auto;
      }
      .diff-action-error {
        color: var(--danger);
      }
      .diff-body-loading {
        opacity: 0.55;
        pointer-events: none;
      }
      .diff-footer {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 12px 20px;
        border-top: 1px solid var(--border);
      }
      .diff-btn {
        padding: 6px 14px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      .diff-btn:hover {
        background: var(--hover);
      }
      .diff-btn-primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .diff-btn-primary:hover {
        background: var(--accent-hover);
      }
      .diff-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* Diagnostics panel — reuses .diff-root / .diff-modal / .diff-header /
         .diff-footer and adds its own body + entry styles. */
      .diag-body {
        padding: 16px 20px;
        overflow-y: auto;
        max-height: 60vh;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: var(--bg);
      }
      .diag-empty {
        color: var(--muted);
        text-align: center;
        padding: 40px 20px;
      }
      .diag-entry {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 12px;
        background: var(--bg);
      }
      .diag-entry-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .diag-entry-header code {
        font-family: ui-monospace, monospace;
        color: var(--accent);
        font-weight: 600;
      }
      .diag-meta {
        color: var(--muted);
        font-size: 0.85em;
        font-weight: normal;
      }
      .diag-label {
        font-size: 0.78em;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-top: 8px;
        margin-bottom: 3px;
      }
      .diag-pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.85em;
        background: var(--hover);
        padding: 8px 10px;
        border-radius: 4px;
      }
      .diag-error {
        background: color-mix(in oklab, var(--danger) 14%, transparent);
        color: var(--danger);
      }
      .diag-status {
        color: var(--muted);
        font-size: 0.9em;
        margin-right: auto;
      }
      .diag-confirm-message {
        margin: 0 0 4px 0;
        color: var(--fg);
      }

      /* Manage Actions panel — refined gallery design.
         Reuses .diff-root / .diff-modal / .diff-header / .diff-footer / .diff-btn
         and adds its own toolbar / grid / detail / confirm-overlay styling. */
      .manage-modal {
        max-width: 1080px;
        width: min(1080px, 96vw);
      }

      /* — Toolbar (search + actions row) — */
      .manage-toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--soft);
      }
      .manage-search {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border);
        background: var(--bg);
        border-radius: 6px;
        padding: 5px 10px;
      }
      .manage-search:focus-within {
        border-color: var(--accent);
      }
      .manage-search input {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        color: var(--fg);
        font: inherit;
      }

      /* — Grid + cards — */
      .manage-section-label {
        padding: 14px 20px 6px 20px;
        font-size: 0.72em;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .manage-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px;
        padding: 0 20px 16px 20px;
      }
      .manage-card {
        position: relative;
        border: 1px solid var(--border);
        background: var(--bg);
        border-radius: 8px;
        padding: 12px 14px;
        cursor: pointer;
        min-height: 130px;
        display: flex;
        flex-direction: column;
        transition: border-color 100ms;
      }
      .manage-card:hover {
        border-color: var(--accent);
        background: var(--soft);
      }
      .manage-card-builtin {
        background: var(--soft);
      }
      .manage-card-shadowed {
        opacity: 0.55;
      }
      .manage-card-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 4px;
      }
      .manage-card-title {
        font-size: 0.98em;
        font-weight: 600;
      }
      .manage-card-meta {
        display: inline-flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .manage-tag {
        display: inline-block;
        font-size: 0.74em;
        padding: 1px 7px;
        border-radius: 999px;
        background: var(--hover);
        color: var(--muted);
        font-family: ui-monospace, monospace;
      }
      .manage-tag-vision {
        background: color-mix(in oklab, var(--accent) 18%, transparent);
        color: var(--accent);
      }
      .manage-tag-shadow {
        background: color-mix(in oklab, var(--warning) 18%, transparent);
        color: var(--warning);
      }
      .manage-card-desc {
        flex: 1;
        margin: 0;
        color: var(--muted);
        font-size: 0.86em;
        line-height: 1.45;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .manage-card-actions {
        display: flex;
        gap: 4px;
        justify-content: flex-end;
        margin-top: 8px;
        opacity: 0;
        transition: opacity 100ms;
      }
      .manage-card:hover .manage-card-actions,
      .manage-card:focus-within .manage-card-actions {
        opacity: 1;
      }
      .manage-icon-btn {
        width: 26px;
        height: 26px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 0.92em;
        color: var(--muted);
        cursor: pointer;
      }
      .manage-icon-btn:hover:not(:disabled) {
        background: var(--hover);
        color: var(--fg);
      }
      .manage-icon-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .manage-icon-btn-danger:hover:not(:disabled) {
        background: color-mix(in oklab, var(--danger) 12%, transparent);
        color: var(--danger);
        border-color: var(--danger);
      }
      .manage-new-card {
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px dashed var(--border);
        background: transparent;
        color: var(--muted);
        min-height: 130px;
        font-size: 0.95em;
        cursor: pointer;
      }
      .manage-new-card:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* — Empty state (no user actions yet) — */
      .manage-empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        margin: 0 20px 16px 20px;
        padding: 36px 24px 28px 24px;
        border: 1px dashed var(--border);
        border-radius: 10px;
        background: var(--soft);
      }
      .manage-empty-icon {
        font-size: 28px;
        margin-bottom: 6px;
      }
      .manage-empty-title {
        font-size: 1.05em;
        font-weight: 600;
        margin: 0 0 4px 0;
      }
      .manage-empty-desc {
        margin: 0 0 16px 0;
        color: var(--muted);
        font-size: 0.9em;
        max-width: 540px;
        line-height: 1.55;
      }
      .manage-empty-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }

      /* — Status / dirty hint at the modal footer — */
      .manage-footer-status {
        flex: 1;
        font-size: 0.85em;
        color: var(--muted);
      }
      .manage-footer-status code {
        background: var(--hover);
        padding: 1px 5px;
        border-radius: 4px;
      }

      /* — Detail (view / edit / create) — */
      .manage-detail {
        padding: 14px 20px 18px 20px;
        background: var(--bg);
        max-height: 70vh;
        overflow-y: auto;
      }
      .manage-breadcrumb {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.86em;
        color: var(--muted);
        margin-bottom: 12px;
      }
      .manage-breadcrumb-link {
        color: var(--accent);
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        font: inherit;
      }
      .manage-breadcrumb-link:hover {
        text-decoration: underline;
      }
      .manage-detail-title {
        margin: 0 0 12px 0;
        font-size: 1.05em;
        font-weight: 600;
      }
      .manage-readonly-banner {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        background: color-mix(in oklab, var(--accent) 8%, transparent);
        border-left: 3px solid var(--accent);
        padding: 8px 12px;
        border-radius: 0 6px 6px 0;
        font-size: 0.86em;
        margin-bottom: 14px;
      }
      .manage-readonly-banner code {
        background: var(--hover);
        padding: 1px 5px;
        border-radius: 4px;
        font-size: 0.92em;
      }

      /* — Pill-style radio groups for scope / kind — */
      .manage-radio-group {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .manage-radio {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border: 1px solid var(--border);
        background: var(--bg);
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 0.85em;
        cursor: pointer;
        user-select: none;
      }
      .manage-radio.checked {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
      }
      .manage-radio.disabled {
        background: var(--soft);
        color: var(--muted);
        cursor: default;
      }
      .manage-radio.disabled.checked {
        background: var(--soft);
        color: var(--accent);
        border-color: var(--accent);
      }

      /* — Validation summary (top-of-form) — */
      .manage-error-summary {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        background: color-mix(in oklab, var(--danger) 8%, transparent);
        border-left: 3px solid var(--danger);
        padding: 10px 14px;
        border-radius: 0 6px 6px 0;
        font-size: 0.86em;
        margin-bottom: 14px;
      }
      .manage-error-summary strong {
        color: var(--danger);
      }
      .manage-error-summary ul {
        margin: 4px 0 0 18px;
        padding: 0;
        color: var(--fg);
      }
      .manage-error-summary li {
        margin: 2px 0;
      }

      /* — Per-field error styling (inputs go red, message renders below) — */
      .manage-field.error .manage-input {
        border-color: var(--danger);
        background: color-mix(in oklab, var(--danger) 6%, var(--bg));
      }

      /* — Prompt textarea wrapper (textarea + char-count footer) — */
      .manage-prompt-wrap {
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        overflow: hidden;
      }
      .manage-prompt-wrap:focus-within {
        outline: 2px solid color-mix(in oklab, var(--accent) 40%, transparent);
        outline-offset: -1px;
        border-color: var(--accent);
      }
      .manage-prompt-wrap.error {
        border-color: var(--danger);
        background: color-mix(in oklab, var(--danger) 6%, var(--bg));
      }
      .manage-prompt-wrap textarea {
        width: 100%;
        border: none;
        outline: none;
        padding: 9px 11px;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.86em;
        line-height: 1.55;
        background: transparent;
        color: var(--fg);
        min-height: 200px;
        resize: vertical;
        box-sizing: border-box;
      }
      .manage-prompt-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 10px;
        border-top: 1px solid var(--border);
        background: var(--soft);
        font-size: 0.78em;
        color: var(--muted);
      }

      /* — Actions row at the bottom of the detail/editor — */
      .manage-run-row {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px dashed var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .manage-run-spacer {
        margin-left: auto;
        font-size: 0.82em;
        color: var(--muted);
      }

      /* — Delete confirmation overlay (inside the existing modal) — */
      .manage-confirm-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
      }
      .manage-confirm-card {
        width: min(440px, 92vw);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        padding: 18px 20px 16px 20px;
      }
      .manage-confirm-card h3 {
        margin: 0 0 6px 0;
        font-size: 1em;
      }
      .manage-confirm-card p {
        margin: 0 0 14px 0;
        color: var(--muted);
        font-size: 0.9em;
        line-height: 1.5;
      }
      .manage-confirm-card code {
        background: var(--hover);
        padding: 1px 5px;
        border-radius: 4px;
        font-size: 0.9em;
      }
      .manage-confirm-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .diff-btn-danger {
        background: var(--danger);
        color: white;
        border-color: var(--danger);
      }
      .diff-btn-danger:hover {
        filter: brightness(0.92);
      }

      /* Form (existing classes, used by editor inputs) */
      .manage-form {
        padding: 16px 20px;
        overflow-y: auto;
        max-height: 65vh;
        display: flex;
        flex-direction: column;
        gap: 14px;
        background: var(--bg);
      }
      .manage-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .manage-field-label {
        font-size: 0.82em;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .manage-field-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .manage-input {
        padding: 7px 9px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
        font: inherit;
        font-size: 0.95em;
        width: 100%;
        box-sizing: border-box;
      }
      .manage-input:focus {
        outline: 2px solid color-mix(in oklab, var(--accent) 40%, transparent);
        outline-offset: -1px;
        border-color: var(--accent);
      }
      .manage-textarea {
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.88em;
        line-height: 1.5;
        resize: vertical;
      }
      .manage-field-error {
        color: var(--danger);
        font-size: 0.85em;
      }

      /* Action picker panel — toolbar-triggered discovery surface. */
      .picker-modal {
        max-width: 520px;
        width: min(520px, 95vw);
      }
      .picker-list {
        padding: 14px 20px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        max-height: 60vh;
        overflow-y: auto;
        background: var(--bg);
      }
      .picker-section-label {
        font-size: 0.75em;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        padding: 10px 0 4px 0;
        margin-top: 6px;
        border-top: 1px dashed var(--border);
      }
      .picker-row {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 2px;
        padding: 9px 12px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--fg);
        font: inherit;
        cursor: pointer;
        text-align: left;
      }
      .picker-row:hover {
        background: var(--hover);
        border-color: var(--accent);
      }
      .picker-row-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }
      .picker-row-title {
        font-size: 1em;
      }
      .picker-row-meta {
        font-size: 0.78em;
        color: var(--muted);
        font-family: ui-monospace, monospace;
      }
      .picker-row-desc {
        font-size: 0.85em;
        color: var(--muted);
      }
    </style>
  </head>
