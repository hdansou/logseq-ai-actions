<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Actions</title>
    <style>
      /* Theme variables — fallback values match Logseq DB's modern default
         palette as closely as possible. The `var(--ls-*, …)` references
         are no-ops in a cross-origin iframe today (Logseq doesn't propagate
         these into plugin docs), but kept so any future SDK change flows
         through automatically. Custom Logseq themes will still see our
         fallbacks; that's a known v1 limitation. */
      :root {
        --bg: var(--ls-primary-background-color, #ffffff);
        --soft: var(--ls-secondary-background-color, #f7f8fa);
        --fg: var(--ls-primary-text-color, #1f2937);
        --muted: var(--ls-secondary-text-color, #6b7280);
        --border: var(--ls-border-color, #e5e7eb);
        --hover: var(--ls-tertiary-background-color, #f3f4f6);
        --accent: var(--ls-link-text-color, #2563eb);
        --accent-hover: var(--ls-link-text-hover-color, #1d4ed8);
        --danger: #dc2626;
        --warning: #d97706;
        --success: #059669;

        /* LOCAL/REMOTE endpoint badge colors (see REQUIREMENTS §8) */
        --endpoint-local-bg: #dcfce7;
        --endpoint-local-fg: #166534;
        --endpoint-remote-bg: #fef3c7;
        --endpoint-remote-fg: #92400e;
      }

      /* Dark mode driven by `html.dark` set from Logseq's theme via
         logseq.App.onThemeModeChanged in src/index.ts.
         See logseq-plugin-dev runtime-gotchas.md §2. */
      html.dark {
        --bg: var(--ls-primary-background-color, #1f2024);
        --soft: var(--ls-secondary-background-color, #24262c);
        --fg: var(--ls-primary-text-color, #e5e7eb);
        --muted: var(--ls-secondary-text-color, #9ca3af);
        --border: var(--ls-border-color, #2c2e36);
        --hover: var(--ls-tertiary-background-color, #2a2c32);
        --accent: var(--ls-link-text-color, #60a5fa);
        --accent-hover: var(--ls-link-text-hover-color, #3b82f6);
        --danger: #f87171;
        --warning: #fbbf24;
        --success: #34d399;

        --endpoint-local-bg: #14532d;
        --endpoint-local-fg: #bbf7d0;
        --endpoint-remote-bg: #78350f;
        --endpoint-remote-fg: #fde68a;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        color: var(--fg);
      }

      /* The iframe is hidden until logseq.showMainUI() is called, so
         a backdrop here only shows when the diff panel is live. */
      body {
        background: rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        overflow-y: auto;
        min-height: 100vh;
      }

      /* Diff panel — rendered into #app by src/ui/show-diff.ts */
      .diff-root {
        width: min(1100px, 95vw);
        margin: 48px 16px;
      }
      .diff-modal {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        /* Cap to the viewport (minus .diff-root's 48px top/bottom margin)
           so the header, action bar, and footer stay in view while the
           middle .diff-body scrolls. Same pattern as .manage-modal. */
        max-height: calc(100vh - 96px);
      }
      .diff-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
      }
      .diff-header-main {
        display: inline-flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }
      .endpoint-badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 0.72em;
        letter-spacing: 0.06em;
        white-space: nowrap;
        vertical-align: baseline;
      }
      .endpoint-badge strong {
        font-weight: 700;
      }
      .endpoint-badge-local {
        background: var(--endpoint-local-bg);
        color: var(--endpoint-local-fg);
      }
      .endpoint-badge-remote {
        background: var(--endpoint-remote-bg);
        color: var(--endpoint-remote-fg);
      }
      .diff-hint {
        color: var(--muted);
        font-size: 0.85em;
      }
      .diff-hint-warn {
        color: var(--danger);
      }
      .diff-hint kbd {
        background: var(--hover);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 6px;
        font-family: inherit;
        font-size: 0.9em;
      }
      .diff-body {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        background: var(--border);
        /* Take the remaining vertical space inside .diff-modal and scroll
           the diff content while header / action bar / footer stay pinned.
           min-height: 0 lets the flex child actually shrink instead of
           pushing the footer offscreen on long content. */
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }
      .diff-column {
        background: var(--bg);
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      .diff-column h4 {
        margin: 0;
        font-size: 0.85em;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .diff-pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 0.95em;
        line-height: 1.55;
      }
      .diff-edit {
        width: 100%;
        min-height: 220px;
        resize: vertical;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 0.95em;
        line-height: 1.55;
        padding: 8px;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .diff-added {
        background: color-mix(in oklab, var(--success) 18%, transparent);
        border-radius: 3px;
        padding: 0 2px;
      }
      .diff-removed {
        background: color-mix(in oklab, var(--danger) 16%, transparent);
        border-radius: 3px;
        padding: 0 2px;
        text-decoration: line-through;
      }
      .diff-action-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
        flex-wrap: wrap;
      }
      .diff-action-btn {
        padding: 5px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--bg);
        color: var(--fg);
        font: inherit;
        font-size: 0.9em;
        cursor: pointer;
      }
      .diff-action-btn:hover:not(:disabled) {
        background: var(--hover);
      }
      .diff-action-btn:disabled {
        cursor: default;
        opacity: 0.55;
      }
      .diff-action-btn-current {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
        opacity: 1;
      }
      .diff-action-status {
        color: var(--muted);
        font-size: 0.85em;
        margin-left: auto;
      }
      .diff-action-error {
        color: var(--danger);
      }
      /* Grouped chip (Rewrite ▾) — same shell as .diff-action-btn but
         with a tiny caret and a popover menu anchored under it. */
      .diff-action-group {
        position: relative;
        display: inline-block;
      }
      .diff-action-caret {
        margin-left: 6px;
        font-size: 0.7em;
        opacity: 0.7;
      }
      .diff-action-menu {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        z-index: 20;
        min-width: 180px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
        padding: 4px;
        display: flex;
        flex-direction: column;
      }
      .diff-action-menu-item {
        text-align: left;
        padding: 6px 10px;
        border: none;
        background: transparent;
        color: var(--fg);
        font: inherit;
        font-size: 0.92em;
        border-radius: 4px;
        cursor: pointer;
      }
      .diff-action-menu-item:hover:not(:disabled) {
        background: var(--hover);
      }
      .diff-action-menu-item:disabled {
        cursor: default;
        opacity: 0.55;
      }
      .diff-action-menu-item-current {
        color: var(--accent);
        font-weight: 600;
      }
      .diff-body-loading {
        opacity: 0.55;
        pointer-events: none;
      }
      .diff-footer {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 12px 20px;
        border-top: 1px solid var(--border);
      }
      .diff-btn {
        padding: 6px 14px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      .diff-btn:hover {
        background: var(--hover);
      }
      .diff-btn-primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .diff-btn-primary:hover {
        background: var(--accent-hover);
      }
      .diff-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* Diagnostics panel — reuses .diff-root / .diff-modal / .diff-header /
         .diff-footer and adds its own body + entry styles. */
      .diag-body {
        padding: 16px 20px;
        overflow-y: auto;
        max-height: 60vh;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: var(--bg);
      }
      .diag-empty {
        color: var(--muted);
        text-align: center;
        padding: 40px 20px;
      }
      .diag-entry {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 12px;
        background: var(--bg);
      }
      .diag-entry-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .diag-entry-header code {
        font-family: ui-monospace, monospace;
        color: var(--accent);
        font-weight: 600;
      }
      .diag-meta {
        color: var(--muted);
        font-size: 0.85em;
        font-weight: normal;
      }
      .diag-label {
        font-size: 0.78em;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-top: 8px;
        margin-bottom: 3px;
      }
      .diag-pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.85em;
        background: var(--hover);
        padding: 8px 10px;
        border-radius: 4px;
      }
      .diag-error {
        background: color-mix(in oklab, var(--danger) 14%, transparent);
        color: var(--danger);
      }
      .diag-status {
        color: var(--muted);
        font-size: 0.9em;
        margin-right: auto;
      }
      .diag-confirm-message {
        margin: 0 0 4px 0;
        color: var(--fg);
      }

      /* Manage Actions panel — refined gallery design.
         Reuses .diff-root / .diff-modal / .diff-header / .diff-footer / .diff-btn
         and adds its own toolbar / grid / detail / confirm-overlay styling. */
      .manage-modal {
        max-width: 1080px;
        width: min(1080px, 96vw);
        /* Cap to the visible viewport (minus the diff-root margin) so the
           whole panel fits on a 13" laptop. The toolbar + footer stay
           pinned; .manage-body in the middle scrolls. */
        max-height: calc(100vh - 96px);
      }
      /* Scrollable middle region inside the modal — sandwiched between
         the toolbar and footer, which both stay visible. The min-height:0
         is required for a flex child to actually scroll instead of
         growing past its parent. */
      .manage-body {
        flex: 1;
        overflow-y: auto;
        min-height: 0;
      }

      /* — Toolbar (search + actions row) — */
      .manage-toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 24px 16px 24px;
        background: var(--bg);
      }
      .manage-search {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border);
        background: var(--bg);
        border-radius: 6px;
        padding: 7px 12px;
      }
      .manage-search:focus-within {
        border-color: var(--accent);
      }
      .manage-search input {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        color: var(--fg);
        font: inherit;
      }

      /* — Grid + cards — */
      /* Bigger / bolder header for the Manage panel — distinct from
         other modals (DiffPanel, ConfirmPanel) that share .diff-header. */
      .manage-modal .diff-header strong {
        font-size: 1.25em;
        font-weight: 700;
      }
      /* Section label row — uppercase muted label on the left, optional
         action button (e.g. "+ Create") on the right. */
      .manage-section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 24px 6px 24px;
      }
      .manage-section-label {
        font-size: 0.72em;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      /* Small outlined "+ Create" button rendered inline with the
         "Your actions" section label. */
      .manage-create-btn {
        padding: 4px 12px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--fg);
        border-radius: 6px;
        font: inherit;
        font-size: 0.85em;
        cursor: pointer;
      }
      .manage-create-btn:hover {
        background: var(--hover);
        border-color: var(--accent);
      }
      /* Two-column row list (newspaper-flow, column-major). Each row is
         a single action — title + tags inline, description below in
         muted text, horizontal divider underneath. No card chrome.
         Column-major (`grid-auto-flow: column`) so a sorted list reads
         top-to-bottom in the left column, then continues in the right
         column — matches the natural alphabetical mental model. The
         render site sets `--row-count` to ceil(items / 2) so the grid
         knows how many rows to lay out before wrapping into column 2. */
      .manage-row-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: repeat(var(--row-count, 1), auto);
        grid-auto-flow: column;
        column-gap: 28px;
        padding: 0 24px 6px 24px;
      }
      .manage-row {
        /* Right pad reserves space for the absolutely-positioned
           Hide/Restore pills floating off `.manage-row-cell`. Falls
           back gracefully when no pill is rendered — the row content
           just doesn't fill the last 84 px. */
        padding: 12px 84px 12px 0;
        border-bottom: 1px solid var(--border);
        background: transparent;
        border-left: none;
        border-right: none;
        border-top: none;
        text-align: left;
        cursor: pointer;
        font: inherit;
        color: inherit;
        width: 100%;
      }
      .manage-row:hover {
        background: color-mix(in oklab, var(--accent) 5%, transparent);
      }
      .manage-row-shadowed {
        opacity: 0.55;
      }
      .manage-row-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 2px;
      }
      .manage-row-title {
        font-size: 1em;
        font-weight: 600;
        color: var(--fg);
      }
      .manage-row-tags {
        display: inline-flex;
        align-items: baseline;
        gap: 6px;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.78em;
        white-space: nowrap;
      }
      .manage-row-tags .sep {
        color: var(--border);
      }
      /* Vision badge stays a pill so it stands out from the plain
         monospace tags. */
      .manage-tag-vision {
        display: inline-block;
        padding: 1px 7px;
        border-radius: 999px;
        background: color-mix(in oklab, var(--accent) 16%, transparent);
        color: var(--accent);
        font-family: ui-monospace, monospace;
        font-size: 0.92em;
      }
      .manage-tag-shadow {
        display: inline-block;
        padding: 1px 7px;
        border-radius: 999px;
        background: color-mix(in oklab, var(--warning) 16%, transparent);
        color: var(--warning);
        font-family: ui-monospace, monospace;
        font-size: 0.78em;
      }
      /* Source pill — `built-in` / `user` — rendered on every row inline
         with the scope/mode tags. Same pill shape as `.manage-tag-shadow`
         in muted-on-muted by default; user variant picks up the accent so
         user actions are scannable in the mixed Hidden bin. */
      .manage-tag-source {
        display: inline-block;
        padding: 1px 7px;
        border-radius: 999px;
        background: color-mix(in oklab, var(--muted) 18%, transparent);
        color: var(--muted);
        font-family: ui-monospace, monospace;
        font-size: 0.78em;
      }
      .manage-tag-source-user {
        background: color-mix(in oklab, var(--accent) 16%, transparent);
        color: var(--accent);
      }
      /* `.manage-row-cell` wraps the row + optional Hide/Restore so all
         three are real <button> siblings (no nested interactive elements
         and no fake-buttons). It IS the grid cell now; the visible
         row content lives in `.manage-row` inside it. Hide / Restore
         float at the right edge via absolute positioning. */
      .manage-row-cell {
        position: relative;
      }
      .manage-row-pill-action {
        position: absolute;
        top: 14px;
        right: 0;
        padding: 2px 10px;
        border-radius: 999px;
        font-family: ui-monospace, monospace;
        font-size: 0.78em;
        cursor: pointer;
        user-select: none;
      }
      .manage-row-hide {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
        opacity: 0;
      }
      .manage-row-cell:hover .manage-row-hide,
      .manage-row-cell:focus-within .manage-row-hide,
      .manage-row-hide:focus-visible {
        opacity: 1;
      }
      .manage-row-hide:hover {
        background: color-mix(in oklab, var(--warning) 16%, transparent);
        border-color: var(--warning);
        color: var(--warning);
      }
      .manage-row-restore {
        background: color-mix(in oklab, var(--accent) 14%, transparent);
        border: 1px solid color-mix(in oklab, var(--accent) 40%, transparent);
        color: var(--accent);
      }
      .manage-row-restore:hover {
        background: color-mix(in oklab, var(--accent) 24%, transparent);
      }
      .manage-row-desc {
        margin: 0;
        color: var(--muted);
        font-size: 0.88em;
        line-height: 1.45;
      }
      .manage-row-empty-search {
        padding: 18px 24px;
        color: var(--muted);
        font-size: 0.9em;
      }

      /* — Empty state (no user actions yet) — single muted line under
         the YOUR ACTIONS section label, per the v3 mockup. */
      .manage-empty-line {
        padding: 12px 24px 16px 24px;
        color: var(--muted);
        font-size: 0.88em;
        line-height: 1.5;
      }

      /* — Hidden bin — collapsible section pinned to the bottom of the
         manage body. Toggle row is its own button with chevron + label
         + count + helper subtitle. Body reuses `.manage-row-list` so the
         same two-column grid renders inside. REQUIREMENTS §16. */
      .manage-hidden-section {
        margin-top: 12px;
        border-top: 1px solid var(--border);
      }
      .manage-hidden-toggle {
        width: 100%;
        background: transparent;
        color: var(--fg);
        border: none;
        padding: 14px 24px;
        text-align: left;
        font: inherit;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .manage-hidden-toggle:hover {
        background: color-mix(in oklab, var(--accent) 5%, transparent);
      }
      .manage-hidden-chev {
        display: inline-block;
        transition: transform 120ms ease;
        color: var(--muted);
        width: 12px;
      }
      .manage-hidden-open .manage-hidden-chev {
        transform: rotate(90deg);
      }
      .manage-hidden-label {
        font-size: 0.72em;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .manage-hidden-count {
        font-family: ui-monospace, monospace;
        background: color-mix(in oklab, var(--warning) 16%, transparent);
        color: var(--warning);
        padding: 1px 8px;
        border-radius: 999px;
        font-size: 0.78em;
      }
      .manage-hidden-helper {
        margin-left: auto;
        font-size: 0.78em;
        color: var(--muted);
      }
      .manage-hidden-list {
        padding-top: 4px;
      }
      .manage-hidden-list .manage-row {
        opacity: 0.78;
      }
      .manage-hidden-list .manage-row:hover {
        opacity: 1;
      }

      /* — Undo toast — bottom-anchored overlay inside the manage modal.
         Inherits the modal's stacking context so it sits above the
         row list but below ConfirmOverlay. Auto-dismisses after ~2.5 s
         (set in UndoToast.tsx). */
      .manage-undo-toast {
        position: fixed;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--fg);
        padding: 10px 16px;
        border-radius: 8px;
        font-size: 0.88em;
        display: inline-flex;
        gap: 14px;
        align-items: center;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
        z-index: 50;
      }
      .manage-undo-link {
        background: transparent;
        border: none;
        color: var(--accent);
        cursor: pointer;
        font: inherit;
        padding: 0;
      }
      .manage-undo-link:hover {
        text-decoration: underline;
      }

      /* — Header overflow menu (the "..." in the top-right of the
         manage modal). Holds Copy all and any future global actions
         that don't deserve toolbar real estate. — */
      .manage-overflow-wrap {
        position: relative;
        display: inline-block;
        margin-right: 8px;
      }
      .manage-overflow-btn {
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--muted);
        font-size: 1.1em;
        cursor: pointer;
      }
      .manage-overflow-btn:hover {
        background: var(--hover);
        color: var(--fg);
      }
      .manage-overflow-menu {
        position: absolute;
        top: calc(100% + 4px);
        right: 0;
        min-width: 160px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
        padding: 4px;
        z-index: 10;
        display: flex;
        flex-direction: column;
      }
      .manage-overflow-item {
        text-align: left;
        background: none;
        border: none;
        color: var(--fg);
        font: inherit;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
      }
      .manage-overflow-item:hover:not(:disabled) {
        background: var(--hover);
      }
      .manage-overflow-item:disabled {
        opacity: 0.45;
        cursor: default;
      }
      /* Legacy compat: a few old class names still appear in the codebase
         until the next refactor pass. Keep the ones that the new layout
         doesn't otherwise repurpose. */
      .manage-empty-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }

      /* — Status / dirty hint at the modal footer — */
      .manage-footer-status {
        flex: 1;
        font-size: 0.85em;
        color: var(--muted);
      }
      .manage-footer-status code {
        background: var(--hover);
        padding: 1px 5px;
        border-radius: 4px;
      }

      /* — Detail (view / edit / create) — */
      .manage-detail {
        padding: 14px 20px 18px 20px;
        background: var(--bg);
        /* Fill the available modal height (capped by manage-modal's
           max-height) and scroll inside; keeps long forms from
           overflowing on smaller screens. */
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }
      .manage-breadcrumb {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.86em;
        color: var(--muted);
        margin-bottom: 12px;
      }
      .manage-breadcrumb-link {
        color: var(--accent);
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        font: inherit;
      }
      .manage-breadcrumb-link:hover {
        text-decoration: underline;
      }
      .manage-detail-title {
        margin: 0 0 12px 0;
        font-size: 1.05em;
        font-weight: 600;
      }
      .manage-readonly-banner {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        background: color-mix(in oklab, var(--accent) 8%, transparent);
        border-left: 3px solid var(--accent);
        padding: 8px 12px;
        border-radius: 0 6px 6px 0;
        font-size: 0.86em;
        margin-bottom: 14px;
      }
      .manage-readonly-banner code {
        background: var(--hover);
        padding: 1px 5px;
        border-radius: 4px;
        font-size: 0.92em;
      }

      /* — Pill-style radio groups for scope / kind — */
      .manage-radio-group {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .manage-radio {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border: 1px solid var(--border);
        background: var(--bg);
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 0.85em;
        cursor: pointer;
        user-select: none;
      }
      .manage-radio.checked {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
      }
      .manage-radio.disabled {
        background: var(--soft);
        color: var(--muted);
        cursor: default;
      }
      .manage-radio.disabled.checked {
        background: var(--soft);
        color: var(--accent);
        border-color: var(--accent);
      }

      /* — Validation summary (top-of-form) — */
      .manage-error-summary {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        background: color-mix(in oklab, var(--danger) 8%, transparent);
        border-left: 3px solid var(--danger);
        padding: 10px 14px;
        border-radius: 0 6px 6px 0;
        font-size: 0.86em;
        margin-bottom: 14px;
      }
      .manage-error-summary strong {
        color: var(--danger);
      }
      .manage-error-summary ul {
        margin: 4px 0 0 18px;
        padding: 0;
        color: var(--fg);
      }
      .manage-error-summary li {
        margin: 2px 0;
      }

      /* — Per-field error styling (inputs go red, message renders below) — */
      .manage-field.error .manage-input {
        border-color: var(--danger);
        background: color-mix(in oklab, var(--danger) 6%, var(--bg));
      }

      /* — Prompt textarea wrapper (textarea + char-count footer) — */
      .manage-prompt-wrap {
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        overflow: hidden;
      }
      .manage-prompt-wrap:focus-within {
        outline: 2px solid color-mix(in oklab, var(--accent) 40%, transparent);
        outline-offset: -1px;
        border-color: var(--accent);
      }
      .manage-prompt-wrap.error {
        border-color: var(--danger);
        background: color-mix(in oklab, var(--danger) 6%, var(--bg));
      }
      .manage-prompt-wrap textarea {
        width: 100%;
        border: none;
        outline: none;
        padding: 9px 11px;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.86em;
        line-height: 1.55;
        background: transparent;
        color: var(--fg);
        min-height: 200px;
        resize: vertical;
        box-sizing: border-box;
      }
      .manage-prompt-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 10px;
        border-top: 1px solid var(--border);
        background: var(--soft);
        font-size: 0.78em;
        color: var(--muted);
      }

      /* — Actions row at the bottom of the detail/editor — */
      .manage-run-row {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px dashed var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .manage-run-spacer {
        margin-left: auto;
        font-size: 0.82em;
        color: var(--muted);
      }

      /* — Delete confirmation overlay (inside the existing modal) — */
      .manage-confirm-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
      }
      .manage-confirm-card {
        width: min(440px, 92vw);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        padding: 18px 20px 16px 20px;
      }
      .manage-confirm-card h3 {
        margin: 0 0 6px 0;
        font-size: 1em;
      }
      .manage-confirm-card p {
        margin: 0 0 14px 0;
        color: var(--muted);
        font-size: 0.9em;
        line-height: 1.5;
      }
      .manage-confirm-card code {
        background: var(--hover);
        padding: 1px 5px;
        border-radius: 4px;
        font-size: 0.9em;
      }
      .manage-confirm-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .diff-btn-danger {
        background: var(--danger);
        color: white;
        border-color: var(--danger);
      }
      .diff-btn-danger:hover {
        filter: brightness(0.92);
      }

      /* Form (existing classes, used by editor inputs) */
      .manage-form {
        padding: 16px 20px;
        overflow-y: auto;
        max-height: 65vh;
        display: flex;
        flex-direction: column;
        gap: 14px;
        background: var(--bg);
      }
      .manage-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .manage-field-label {
        font-size: 0.82em;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .manage-field-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .manage-input {
        padding: 7px 9px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
        font: inherit;
        font-size: 0.95em;
        width: 100%;
        box-sizing: border-box;
      }
      .manage-input:focus {
        outline: 2px solid color-mix(in oklab, var(--accent) 40%, transparent);
        outline-offset: -1px;
        border-color: var(--accent);
      }
      .manage-textarea {
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.88em;
        line-height: 1.5;
        resize: vertical;
      }
      .manage-field-error {
        color: var(--danger);
        font-size: 0.85em;
      }
      /* Inline hint rendered under scope / output-mode / kind fields,
         describing the currently-selected value. */
      .manage-field-hint {
        color: var(--muted);
        font-size: 0.82em;
        line-height: 1.45;
        margin-top: 2px;
      }

      /* Action picker panel — toolbar-triggered discovery surface. */
      .picker-modal {
        max-width: 640px;
        width: min(640px, 95vw);
      }
      .picker-body {
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        max-height: calc(100vh - 200px);
        overflow-y: auto;
        background: var(--bg);
      }
      .picker-group { display: flex; flex-direction: column; gap: 6px; }
      .picker-group-head {
        display: flex;
        align-items: baseline;
        gap: 6px;
        font-size: 0.72em;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        padding: 0 4px;
      }
      .picker-group-count { font-weight: 500; opacity: 0.75; }
      .picker-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .picker-card {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 8px 12px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--fg);
        font: inherit;
        cursor: pointer;
        text-align: left;
        min-width: 0;
      }
      .picker-card:hover:not(:disabled) {
        background: var(--hover);
        border-color: var(--accent);
      }
      .picker-card:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .picker-card-title {
        font-weight: 600;
        font-size: 0.95em;
        line-height: 1.25;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .picker-card-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .picker-pill {
        display: inline-flex;
        align-items: center;
        padding: 1px 7px;
        border-radius: 999px;
        background: color-mix(in oklab, var(--muted) 14%, transparent);
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.7em;
        line-height: 1.5;
      }
      .picker-pill-vision {
        background: color-mix(in oklab, var(--warning) 18%, transparent);
        color: var(--warning);
      }
      .picker-pill-custom {
        background: color-mix(in oklab, var(--accent) 16%, transparent);
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
