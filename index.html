<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Actions</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --hover: #f3f4f6;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --danger: #dc2626;
        --warning: #d97706;
        --success: #059669;

        /* LOCAL/REMOTE endpoint badge colors (see REQUIREMENTS §8) */
        --endpoint-local-bg: #dcfce7;
        --endpoint-local-fg: #166534;
        --endpoint-remote-bg: #fef3c7;
        --endpoint-remote-fg: #92400e;
      }

      /* Dark mode driven by `html.dark` set from Logseq's theme via
         logseq.App.onThemeModeChanged in src/index.ts.
         See logseq-plugin-dev runtime-gotchas.md §2. */
      html.dark {
        --bg: #1f2024;
        --fg: #e5e7eb;
        --muted: #9ca3af;
        --border: #2c2e36;
        --hover: #2a2c32;
        --accent: #60a5fa;
        --accent-hover: #3b82f6;
        --danger: #f87171;
        --warning: #fbbf24;
        --success: #34d399;

        --endpoint-local-bg: #14532d;
        --endpoint-local-fg: #bbf7d0;
        --endpoint-remote-bg: #78350f;
        --endpoint-remote-fg: #fde68a;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        color: var(--fg);
      }

      /* The iframe is hidden until logseq.showMainUI() is called, so
         a backdrop here only shows when the diff panel is live. */
      body {
        background: rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        overflow-y: auto;
        min-height: 100vh;
      }

      /* Diff panel — rendered into #app by src/ui/show-diff.ts */
      .diff-root {
        width: min(1100px, 95vw);
        margin: 48px 16px;
      }
      .diff-modal {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .diff-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
      }
      .diff-hint {
        color: var(--muted);
        font-size: 0.85em;
      }
      .diff-hint kbd {
        background: var(--hover);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 6px;
        font-family: inherit;
        font-size: 0.9em;
      }
      .diff-body {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        background: var(--border);
        min-height: 240px;
      }
      .diff-column {
        background: var(--bg);
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      .diff-column h4 {
        margin: 0;
        font-size: 0.85em;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .diff-pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 0.95em;
        line-height: 1.55;
      }
      .diff-edit {
        width: 100%;
        min-height: 220px;
        resize: vertical;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 0.95em;
        line-height: 1.55;
        padding: 8px;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .diff-added {
        background: color-mix(in oklab, var(--success) 18%, transparent);
        border-radius: 3px;
        padding: 0 2px;
      }
      .diff-removed {
        background: color-mix(in oklab, var(--danger) 16%, transparent);
        border-radius: 3px;
        padding: 0 2px;
        text-decoration: line-through;
      }
      .diff-footer {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 12px 20px;
        border-top: 1px solid var(--border);
      }
      .diff-btn {
        padding: 6px 14px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      .diff-btn:hover {
        background: var(--hover);
      }
      .diff-btn-primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .diff-btn-primary:hover {
        background: var(--accent-hover);
      }
      .diff-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* Diagnostics panel — reuses .diff-root / .diff-modal / .diff-header /
         .diff-footer and adds its own body + entry styles. */
      .diag-body {
        padding: 16px 20px;
        overflow-y: auto;
        max-height: 60vh;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: var(--bg);
      }
      .diag-empty {
        color: var(--muted);
        text-align: center;
        padding: 40px 20px;
      }
      .diag-entry {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 12px;
        background: var(--bg);
      }
      .diag-entry-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .diag-entry-header code {
        font-family: ui-monospace, monospace;
        color: var(--accent);
        font-weight: 600;
      }
      .diag-meta {
        color: var(--muted);
        font-size: 0.85em;
        font-weight: normal;
      }
      .diag-label {
        font-size: 0.78em;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-top: 8px;
        margin-bottom: 3px;
      }
      .diag-pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.85em;
        background: var(--hover);
        padding: 8px 10px;
        border-radius: 4px;
      }
      .diag-error {
        background: color-mix(in oklab, var(--danger) 14%, transparent);
        color: var(--danger);
      }
      .diag-status {
        color: var(--muted);
        font-size: 0.9em;
        margin-right: auto;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
